<div id="particles-js">
  <div class="header">
      <h1>
        <span class="site-title">{{ site.username }}</span>
        <span class="site-description" data-i18n="hero.subtitle">{{ site.user_title }}</span>
      </h1>
      <div class="header-icons">
        <a aria-label="Envoyer un email" href="mailto:{{ site.email }}"><i class="icon fa fa-envelope" aria-hidden="true"></i></a>
        <a aria-label="Mon GitHub" target="_blank" rel="noopener noreferrer" href="https://github.com/{{ site.github_username }}"><i class="icon fa fa-github-alt" aria-hidden="true"></i></a>
      </div>
      <div class="header-links">
        <a class="link" href="#about" data-scroll data-i18n="hero.about">À propos</a>
        <a class="link" href="#projects" data-scroll data-i18n="hero.projects">Projets</a>
      </div>
  </div>
  <a class="down" href="#about" data-scroll aria-label="Aller à la section À propos"><i class="icon fa fa-chevron-down" aria-hidden="true"></i></a>
</div>
