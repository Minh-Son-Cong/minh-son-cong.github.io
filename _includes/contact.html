<div class="user-details">
  <h2 class="section-title" data-i18n="contact.title">Contact</h2>
  <p data-i18n="contact.subtitle">Vous souhaitez échanger à propos d'un projet, d'une alternance ou d'un stage ? N'hésitez pas à me contacter.</p>
</div>
<div class="contact-grid">
  <a class="contact-card" href="tel:+33749271311">
    <span class="contact-card-icon"><i class="fa fa-phone" aria-hidden="true"></i></span>
    <span class="contact-card-body">
      <span class="contact-card-label" data-i18n="contact.tel.label">Téléphone</span>
      <span class="contact-card-value">{{ site.phone }}</span>
    </span>
  </a>
  <a class="contact-card" href="mailto:{{ site.email }}">
    <span class="contact-card-icon"><i class="fa fa-envelope" aria-hidden="true"></i></span>
    <span class="contact-card-body">
      <span class="contact-card-label" data-i18n="contact.mail.label">Mail</span>
      <span class="contact-card-value">{{ site.email }}</span>
    </span>
  </a>
  <a class="contact-card" target="_blank" rel="noopener noreferrer" href="{{ site.gitlab_url }}">
    <span class="contact-card-icon"><i class="fa fa-gitlab" aria-hidden="true"></i></span>
    <span class="contact-card-body">
      <span class="contact-card-label" data-i18n="contact.git.label">Git (GitLab Univ. Lille)</span>
      <span class="contact-card-value">gitlab.univ-lille.fr/minh-son.cong.etu</span>
    </span>
  </a>
  <a class="contact-card" target="_blank" rel="noopener noreferrer" href="{{ site.linkedin_url }}">
    <span class="contact-card-icon"><i class="fa fa-linkedin" aria-hidden="true"></i></span>
    <span class="contact-card-body">
      <span class="contact-card-label" data-i18n="contact.linkedin.label">LinkedIn</span>
      <span class="contact-card-value">minh-son-cong-275577387</span>
    </span>
  </a>
</div>
