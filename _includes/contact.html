<div class="user-details">
  <h2 class="section-title" data-i18n="contact.title">Contact</h2>
  <p data-i18n="contact.subtitle">Vous souhaitez échanger à propos d'un projet, d'une alternance ou d'un stage ? N'hésitez pas à me contacter.</p>
  <div class="contact-links">
    <a class="project-link contact-btn" href="mailto:{{ site.email }}">
      <i class="fa fa-envelope" aria-hidden="true"></i>
      <span>{{ site.email }}</span>
    </a>
    <a class="project-link contact-btn" target="_blank" rel="noopener noreferrer" href="https://github.com/{{ site.github_username }}">
      <i class="fa fa-github-alt" aria-hidden="true"></i>
      <span>github.com/{{ site.github_username }}</span>
    </a>
  </div>
</div>
